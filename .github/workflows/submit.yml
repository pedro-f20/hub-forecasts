name: Weekly AI4Casting submission

on:
  schedule:
    # PHO data lands Friday morning Toronto; deadline Saturday 23:30 Toronto (03:30-04:30 UTC Sunday)
    - cron: "0 17 * * 5"
    - cron: "0 22 * * 5"
    - cron: "0 14 * * 6"
    - cron: "0 22 * * 6"
  workflow_dispatch:
    inputs:
      ref:
        description: "Round (Saturday, YYYY-MM-DD); default the coming Saturday"
        required: false
      dry_run:
        description: "Forecast only, no PR"
        type: boolean
        default: false

permissions:
  contents: write  # appends to submissions.csv, which also keeps the schedule from going idle

concurrency:
  group: submit
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: chronos-2-29ec3766d36d6f73f0696f85560a422f50e8498c

      - name: Install
        run: |
          uv venv --python 3.12
          uv pip install --torch-backend cpu -r requirements.txt

      - name: Forecast and submit
        env:
          GH_TOKEN: ${{ secrets.HUB_TOKEN }}
          REF: ${{ inputs.ref }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          # the 22:00 UTC Saturday run is the last before the deadline
          FINAL: ${{ github.event.schedule == '0 22 * * 6' && '1' || '' }}
        run: bash submit.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forecast
          path: out-*/
          if-no-files-found: ignore

      - name: Record submission
        run: |
          git diff --quiet submissions.csv && exit 0
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -q -am "Record submission"
          git pull -q --rebase
          git push -q
